name: CI

on:
  push:
    branches:
      - master
  pull_request: {}
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BOOKSHELF_METADATA_OFFLINE: "1"

jobs:
  check:
    name: Checks
    timeout-minutes: 15
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Setup Bun package manager
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun ci

      - name: Check
        run: bun run check

  build:
    name: Build
    timeout-minutes: 15
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Setup Bun package manager
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun ci

      - name: Verify Rulesync outputs
        run: bun run check:rulesync

      - name: Build
        run: bun run build

      - name: Validate Cloudflare Pages output
        run: bun run check:deployment

      - name: Save production output
        uses: actions/upload-artifact@v7
        with:
          name: site-dist-${{ github.sha }}
          path: dist/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
          overwrite: true

  performance:
    name: Performance budgets
    needs: build
    timeout-minutes: 15
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Setup Bun package manager
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun ci

      - name: Install Chromium
        run: bunx playwright install --with-deps chromium

      - name: Download production output
        uses: actions/download-artifact@v8
        with:
          name: site-dist-${{ github.sha }}
          path: dist/

      - name: Performance budgets
        run: bun run check:performance

      - name: Save performance evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse
          path: artifacts/
          retention-days: 14
          overwrite: true

  browser:
    name: Browser behavior (${{ matrix.shard }}/3)
    needs: build
    timeout-minutes: 20
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]

    steps:
      - name: Check out code
        uses: actions/checkout@v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Setup Bun package manager
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun ci

      - name: Install Chromium
        run: bunx playwright install --with-deps chromium

      - name: Download production output
        uses: actions/download-artifact@v8
        with:
          name: site-dist-${{ github.sha }}
          path: dist/

      - name: Browser behavior
        run: bun run check:browser --shard=${{ matrix.shard }}/3

      - name: Save browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-${{ matrix.shard }}
          path: artifacts/
          retention-days: 14
          overwrite: true
