name: CI

on:
  push:
    branches:
      - master
  pull_request: {}

permissions:
  contents: read

jobs:
  check:
    name: Checks
    timeout-minutes: 15
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v6.0.2

      - name: Setup Bun package manager
        uses: oven-sh/setup-bun@v2.2.0

      - name: Install dependencies
        run: bun ci

      - name: Check
        run: bun run check

  build:
    name: Build
    timeout-minutes: 15
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v6.0.2

      - name: Setup Bun package manager
        uses: oven-sh/setup-bun@v2.2.0

      - name: Install dependencies
        run: bun ci

      - name: Verify Rulesync outputs
        run: bun run check:rulesync

      - name: Build
        run: docker build --output dist .
